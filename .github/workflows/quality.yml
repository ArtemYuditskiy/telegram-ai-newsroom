name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups --python ${{ matrix.python-version }}

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Audit dependencies
        run: uv run pip-audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image and smoke-test migrations
        run: |
          docker build -t newsroom-ci .
          docker run --rm newsroom-ci telegram-ai-newsroom db upgrade --db /data/ci.db
